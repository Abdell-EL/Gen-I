name: Security

on:
  pull_request:
  push:
    branches:
      - phase-2-auth-security
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json || true
          python .github/scripts/pip_audit_policy.py pip-audit.json

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Set up Python for audit policy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          npm audit --json > npm-audit.json || true
          python3 ../../.github/scripts/npm_audit_policy.py npm-audit.json

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks redacted secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          args: detect --source . --redact --verbose

  trivy-filesystem:
    name: trivy-filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Trivy exception policy
        run: python3 .github/scripts/validate_trivy_policy.py

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  trivy-backend-image:
    name: trivy-backend-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk before runner cleanup
        run: |
          df -h
          docker system df || true

      - name: Free runner disk before backend image build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker builder prune -af || true
          df -h
          docker system df || true

      - name: Build backend image
        run: docker build -t lab-ia-genius-api:security backend

      - name: Disk after backend image build
        run: |
          df -h
          docker system df || true
          docker image inspect lab-ia-genius-api:security --format 'backend_image_size_bytes={{.Size}}'

      - name: Prune build cache before Trivy image scan
        run: |
          docker builder prune -af || true
          docker image inspect lab-ia-genius-api:security --format 'backend_image_available={{.Id}} size_bytes={{.Size}}'
          df -h
          docker system df || true

      - name: Validate Trivy exception policy
        run: python3 .github/scripts/validate_trivy_policy.py

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: lab-ia-genius-api:security
          scanners: vuln
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
