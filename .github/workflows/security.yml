name: Security

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.txt --format json --output pip-audit.json || true
          python .github/scripts/pip_audit_policy.py pip-audit.json

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Set up Python for audit policy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          npm audit --json > npm-audit.json || true
          python3 ../../.github/scripts/npm_audit_policy.py npm-audit.json

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks redacted secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          args: detect --source . --redact --verbose

  trivy-filesystem:
    name: trivy-filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  trivy-backend-image:
    name: trivy-backend-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t lab-ia-genius-api:security backend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lab-ia-genius-api:security
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
